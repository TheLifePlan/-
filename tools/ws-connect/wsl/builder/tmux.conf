# 全端末共通。端末固有の名前/宛先/Fキーは~/ai/terminal.confに保持する。
set -g prefix C-a
unbind C-b
bind C-a send-prefix
set -g mouse on
set -g status on
set -g status-interval 1
set -g base-index 1
set -g status-style 'bg=colour236 fg=colour250'
set -g window-status-current-style 'bg=colour32 fg=colour231 bold'
set -g window-status-current-format ' #W '
set -g window-status-format ' #W '
set -g status-right ''
setw -g aggressive-resize on
bind -n C-Right next-window
bind -n C-Left previous-window
set -g set-clipboard on
set -g focus-events on
run-shell 'if [ -x /opt/homebrew/bin/python3 ]; then py=/opt/homebrew/bin/python3; else py=python3; fi; "$py" "$HOME/ai/bin/tmux-terminal-config.py" --socket-path "#{socket_path}"'
