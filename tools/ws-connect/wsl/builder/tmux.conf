# WS: 本社と同じ固定Fキー。head/handsの切替には連動しない。
set -g prefix C-a
unbind C-b
bind C-a send-prefix
set -g mouse on
set -g base-index 0
set -g status-left '[WS] '
set -g status-right ''
set -g window-status-format ' #W '
set -g window-status-current-format ' #W '
set -g set-clipboard on
set -g focus-events on
bind -n C-Right next-window
bind -n C-Left previous-window
bind -n Home select-window -t '=win:=WSMENU メニュー'
bind-key -n F1 select-window -t '=win:=WSCD01 Codexコマンダー'
bind-key -n F2 select-window -t '=win:=WSCD05 さなこ'
bind-key -n F3 select-window -t '=win:=WSCD04 えまこ'
bind-key -n F4 select-window -t '=win:=WSCD06 みおこ'
bind-key -n F5 select-window -t '=win:=WSCL01 Claudeコマンダー'
bind-key -n F6 select-window -t '=win:=WSCL05 さなくろ'
bind-key -n F7 select-window -t '=win:=WSCL04 えまくろ'
bind-key -n F8 select-window -t '=win:=WSCL06 みおくろ'
bind-key -n F9 select-window -t '=win:=WSGR01 Grokコマンダー'
bind-key -n F10 select-window -t '=win:=WSGR05 さな'
bind-key -n F11 select-window -t '=win:=WSGR04 えま'
bind-key -n F12 select-window -t '=win:=WSGR06 みお'
