<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0d17">
  <title>Ninja Dash</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>

    <div id="hud">
      <div class="hud-left">
        <div class="hud-label">SCORE</div>
        <div id="score">0</div>
      </div>
      <div class="hud-right">
        <div class="hud-label">BEST</div>
        <div id="best">0</div>
      </div>
    </div>

    <div id="title" class="overlay">
      <h1>NINJA<span>DASH</span></h1>
      <p class="sub">画面の左右をタップして避けろ</p>
      <p class="legend"><span class="dot star"></span> 星を集めて +10 &nbsp;&nbsp; <span class="dot rock"></span> 岩を避けろ</p>
      <button id="startBtn" class="btn">START</button>
    </div>

    <div id="gameover" class="overlay hidden">
      <h2>GAME OVER</h2>
      <p class="result">SCORE <span id="finalScore">0</span></p>
      <p class="result small">BEST <span id="finalBest">0</span></p>
      <button id="retryBtn" class="btn">RETRY</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
